ty{color:var(--text-dim); font-size:14px; padding:18px 0;}\n\n  /* ---------- SITEMAP ---------- */\n  .sitemap-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:36px; padding:20px 0 90px;}\n  .sitemap-col h4{font-family:'Sora',sans-serif; font-size:15px; margin-bottom:16px; color:var(--pink); letter-spacing:0.05em; text-transform:uppercase;}\n  .sitemap-col ul{display:flex; flex-direction:column; gap:12px;}\n  .sitemap-col a{color:var(--text-dim); font-size:14.5px;}\n  .sitemap-col a:hover{color:var(--text);}\n\n  footer{padding:44px 0; text-align:center; border-top:1px solid var(--panel-line);}\n  footer p{color:var(--text-dim); font-size:13px;}\n  footer .foot-tagline{\n    font-size:11px; letter-spacing:0.18em; color:var(--text-dim); margin-bottom:14px; font-weight:600;\n  }\n  footer .foot-links{display:flex; justify-content:center; gap:22px; margin-bottom:18px; font-size:12.5px; flex-wrap:wrap;}\n  footer .foot-links a{color:var(--text-dim);}\n  footer .foot-links a:hover{color:var(--text);}\n\n  @media(max-width:860px){\n    nav ul{display:none;}\n    .nav-cta{display:none;}\n    .about-grid, .contact-grid, .social-card{grid-template-columns:1fr; gap:40px;}\n    .research-grid, .course-grid, .activity-grid, .sitemap-grid, .social-stats{grid-template-columns:1fr;}\n    .stat{padding:0 22px;}\n    .form-row{grid-template-columns:1fr;}\n  }\n\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <nav>\n      <a class=\"brand\" href=\"#\" data-page=\"index.html\">\n        <div class=\"brand-badge\"><span>ST</span></div>\n        <div class=\"brand-name\">Sachin Tekriwal<small>AI RESEARCH &amp; EDUCATION</small></div>\n      </a>\n      <ul>\n          <li><a href=\"#\" data-page=\"index.html\" class=\"active\">Home</a></li>\n          <li><a href=\"#\" data-page=\"about.html\">About</a></li>\n          <li><a href=\"#\" data-page=\"courses.html\">Courses</a></li>\n          <li><a href=\"#\" data-page=\"research.html\">Research</a></li>\n          <li><a href=\"#\" data-page=\"social.html\">Social</a></li>\n          <li><a href=\"#\" data-page=\"contact.html\">Contact</a></li>\n      </ul>\n      <a class=\"nav-cta\" href=\"#\" data-page=\"contact.html\">Contact</a>\n    </nav>\n  </div>\n</header>\n\n<section class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">AI RESEARCH &amp; EDUCATION CENTER</div>\n    <h1 class=\"grad-text\">SACHIN TEKRIWAL</h1>\n    <p class=\"tagline\">LEARN &nbsp;·&nbsp; RESEARCH &nbsp;·&nbsp; INNOVATE &nbsp;·&nbsp; TRANSFORM</p>\n    <p class=\"desc\">Building applied AI research and hands‑on education — helping students and teams move from fundamentals to real-world machine intelligence.</p>\n    <div class=\"hero-ctas\">\n      <a href=\"#\" data-page=\"courses.html\" class=\"btn-primary\">Explore Courses</a>\n      <a href=\"#\" data-page=\"contact.html\" class=\"btn-ghost\">Get in Touch</a>\n    </div>\n\n    <div class=\"stat-strip\">\n      <div class=\"stat\"><b class=\"grad-text\">32+</b><span>YEARS IN IT</span></div>\n      <div class=\"stat\"><b class=\"grad-text\">500+</b><span>STUDENTS TRAINED</span></div>\n      <div class=\"stat\"><b class=\"grad-text\">12</b><span>RESEARCH PROJECTS</span></div>\n      <div class=\"stat\"><b class=\"grad-text\">8</b><span>COURSES LIVE</span></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"about\" id=\"about\">\n  <div class=\"wrap about-grid\">\n    <div class=\"about-visual\">\n      <div class=\"core\"></div>\n      <svg viewBox=\"0 0 200 200\" fill=\"none\">\n        <defs>\n          <linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"200\" y2=\"200\">\n            <stop offset=\"0%\" stop-color=\"#ffc93c\"/>\n            <stop offset=\"35%\" stop-color=\"#ff4fa3\"/>\n            <stop offset=\"65%\" stop-color=\"#a63bff\"/>\n            <stop offset=\"100%\" stop-color=\"#4d7cff\"/>\n          </linearGradient>\n        </defs>\n        <circle cx=\"100\" cy=\"100\" r=\"70\" stroke=\"url(#g1)\" stroke-width=\"1.4\" opacity=\"0.7\"/>\n        <circle cx=\"100\" cy=\"100\" r=\"46\" stroke=\"url(#g1)\" stroke-width=\"1.4\" opacity=\"0.5\"/>\n        <path d=\"M40 100 L80 100 L80 60 L120 60 L120 140 L160 140\" stroke=\"url(#g1)\" stroke-width=\"2\"/>\n        <path d=\"M40 70 L60 70 L60 130 L100 130\" stroke=\"url(#g1)\" stroke-width=\"2\" opacity=\"0.6\"/>\n        <circle cx=\"40\" cy=\"100\" r=\"4\" fill=\"url(#g1)\"/>\n        <circle cx=\"160\" cy=\"140\" r=\"4\" fill=\"url(#g1)\"/>\n        <circle cx=\"100\" cy=\"130\" r=\"4\" fill=\"url(#g1)\"/>\n        <circle cx=\"120\" cy=\"60\" r=\"4\" fill=\"url(#g1)\"/>\n      </svg>\n    </div>\n    <div class=\"about-text\">\n      <div class=\"section-label\">ABOUT</div>\n      <h3>A mind built for systems</h3>\n      <p>Sachin Tekriwal is an AI Engineer, AI Scientist and Teacher based in Mumbai, India, with 20+ years of experience in enterprise software and applied AI. He holds an MCA from MGU and an Advanced Diploma from IIIT Bangalore, and currently serves as CTO at NKB Workers.</p>\n      <p>His work sits at the intersection of intelligence and automation — approaching every challenge as an architecture problem, engineering solutions that reduce friction, increase signal, and compound over time.</p>\n      <div class=\"about-tags\">\n        <span class=\"highlight\">AI Scientist</span>\n        <span>20+ Years Experience</span>\n        <span>CTO, NKB Workers</span>\n        <span>MCA, MGU</span>\n        <span>Adv. Diploma, IIIT Bangalore</span>\n        <span>Mumbai, India</span>\n      </div>\n      <div class=\"about-tags\" style=\"margin-top:14px;\">\n        <a href=\"#\" data-page=\"about.html\" class=\"btn-ghost\" style=\"padding:11px 22px; font-size:13px;\">Read Full Bio →</a>\n      </div>\n    </div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-tagline grad-text\">LEARN · RESEARCH · INNOVATE · TRANSFORM</div>\n    <div class=\"foot-links\">\n      <a href=\"#  border-radius:999px; border:1px solid var(--panel-line); color:var(--text-dim);\n  }\n  .about-tags span.highlight{\n    border-color:transparent;\n    background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box, var(--grad) border-box;\n    border:1.5px solid transparent; color:var(--text); font-weight:600;\n  }\n\n  .research{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);}\n  .research-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}\n  .r-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:32px 26px;\n    transition:transform 0.25s, border-color 0.25s;\n  }\n  .r-card:hover{transform:translateY(-6px); border-color:rgba(255,255,255,0.2);}\n  .r-icon{\n    width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;\n    background:var(--grad); margin-bottom:22px; font-size:20px;\n  }\n  .r-card h4{font-family:'Sora',sans-serif; font-size:18px; margin-bottom:12px; font-weight:600;}\n  .r-card p{color:var(--text-dim); font-size:14px; line-height:1.7;}\n  .r-card .r-tag{display:inline-block; margin-top:18px; font-size:11px; letter-spacing:0.08em; color:var(--pink); font-weight:700; text-transform:uppercase;}\n\n  .courses{padding:90px 0;}\n  .course-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}\n  .c-card{\n    border:1px solid var(--panel-line); border-radius:18px; overflow:hidden;\n    background:var(--panel); display:flex; flex-direction:column;\n  }\n  .c-top{\n    padding:26px 26px 20px; border-bottom:1px solid var(--panel-line);\n    display:flex; align-items:flex-start; justify-content:space-between;\n  }\n  .c-level{font-size:11px; font-weight:700; letter-spacing:0.08em; padding:5px 12px; border-radius:999px; border:1px solid var(--panel-line); color:var(--text-dim);}\n  .c-body{padding:24px 26px; flex:1;}\n  .c-body h4{font-family:'Sora',sans-serif; font-size:19px; font-weight:600; margin-bottom:10px;}\n  .c-body p{color:var(--text-dim); font-size:14px; line-height:1.7; margin-bottom:18px;}\n  .c-meta{display:flex; gap:16px; font-size:12.5px; color:var(--text-dim); margin-bottom:0;}\n  .c-meta b{color:var(--text); font-weight:600;}\n  .c-students{\n    display:flex; align-items:center; gap:8px; margin-top:16px; font-size:12.5px; color:var(--text-dim);\n  }\n  .avatars{display:flex;}\n  .avatars span{\n    width:22px; height:22px; border-radius:50%; border:2px solid var(--panel);\n    background:var(--grad); margin-left:-8px; display:inline-block;\n  }\n  .avatars span:first-child{margin-left:0;}\n  .c-bottom{padding:20px 26px; border-top:1px solid var(--panel-line);}\n  .c-enroll{\n    display:block; text-align:center; width:100%; padding:12px; border-radius:10px;\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:13.5px; border:none; cursor:pointer;\n  }\n\n  .social{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);}\n  .social-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:22px; padding:44px;\n    display:grid; grid-template-columns:1.2fr 0.8fr; gap:40px; align-items:center;\n  }\n  .social-card h3{font-family:'Sora',sans-serif; font-size:26px; font-weight:700; margin-bottom:14px;}\n  .social-card p{color:var(--text-dim); font-size:15px; line-height:1.8; margin-bottom:22px;}\n  .social-links{display:flex; gap:14px; flex-wrap:wrap;}\n  .social-stats{display:grid; grid-template-columns:1fr 1fr; gap:20px;}\n  .social-stats .stat-box{\n    text-align:center; padding:22px 10px; border:1px solid var(--panel-line); border-radius:14px;\n  }\n  .social-stats .stat-box b{display:block; font-family:'Sora',sans-serif; font-size:26px; font-weight:700;}\n  .social-stats .stat-box span{font-size:11px; color:var(--text-dim); letter-spacing:0.05em;}\n  .activity-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:36px;}\n  .activity-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:26px;\n  }\n  .activity-card .r-icon{width:40px; height:40px; font-size:17px; margin-bottom:16px;}\n  .activity-card h4{font-family:'Sora',sans-serif; font-size:16px; margin-bottom:10px; font-weight:600;}\n  .activity-card p{color:var(--text-dim); font-size:13.5px; line-height:1.7;}\n\n  .contact{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line);}\n  .contact-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:60px;}\n  .contact-info h3{font-family:'Sora',sans-serif; font-size:28px; margin-bottom:18px; font-weight:700;}\n  .contact-info p{color:var(--text-dim); line-height:1.8; font-size:15px; margin-bottom:30px;}\n  .info-row{display:flex; align-items:center; gap:14px; margin-bottom:18px; font-size:14px;}\n  .info-icon{\n    width:38px; height:38px; border-radius:10px; border:1px solid var(--panel-line);\n    display:flex; align-items:center; justify-content:center; flex-shrink:0;\n  }\n  form{background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:34px;}\n  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}\n  label{font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:8px; font-weight:500;}\n  input, textarea{\n    width:100%; background:var(--bg); border:1px solid var(--panel-line); border-radius:10px;\n    padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px;\n  }\n  input:focus, textarea:focus{outline:2px solid var(--purple); outline-offset:1px; border-color:transparent;}\n  textarea{resize:vertical; min-height:110px; margin-bottom:22px;}\n  .form-full{margin-bottom:16px;}\n  .submit-btn{\n    width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer;\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:14.5px;\n  }\n\n  /* ---------- COMMENTS ---------- */\n  .comments{padding:90px 0;}\n  .comments .section-head{text-align:left; margin-bottom:36px;}\n  .comment-form{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:28px; margin-bottom:36px;\n  }\n  .comment-form .form-row{grid-template-columns:1fr 1fr;}\n  .comment-list{display:flex; flex-direction:column; gap:18px;}\n  .comment-item{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:22px 24px;\n  }\n  .comment-item .c-head{display:flex; align-items:center; gap:12px; margin-bottom:10px;}\n  .comment-item .c-avatar{\n    width:34px; height:34px; border-radius:50%; background:var(--grad); flex-shrink:0;\n    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#0a0a16;\n    font-family:'Sora',sans-serif;\n  }\n  .comment-item .c-name{font-weight:600; font-size:14px;}\n  .comment-item .c-time{font-size:11.5px; color:var(--text-dim); margin-left:auto;}\n  .comment-item .c-text{color:var(--text-dim); font-size:14px; line-height:1.7;}\n  .comment-empty{color:var(--text-dim); font-size:14px; padding:18px 0;}\n\n  /* ---------- SITEMAP ---------- */\n  .sitemap-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:36px; padding:20px 0 90px;}\n  .sitemap-col h4{font-family:'Sora',sans-serif; font-size:15px; margin-bottom:16px; color:var(--pink); letter-spacing:0.05em; text-transform:uppercase;}\n  .sitemap-col ul{display:flex; flex-direction:column; gap:12px;}\n  .sitemap-col a{color:var(--text-dim); font-size:14.5px;}\n  .sitemap-col a:hover{color:var(--text);}\n\n  footer{padding:44px 0; text-align:center; border-top:1px solid var(--panel-line);}\n  footer p{color:var(--text-dim); font-size:13px;}\n  footer .foot-tagline{\n    font-size:11px; letter-spacing:0.18em; color:var(--text-dim); margin-bottom:14px; font-weight:600;\n  }\n  footer .foot-links{display:flex; justify-content:center; gap:22px; mar   <stop offset=\"0%\" stop-color=\"#ffc93c\"/>\n            <stop offset=\"35%\" stop-color=\"#ff4fa3\"/>\n            <stop offset=\"65%\" stop-color=\"#a63bff\"/>\n            <stop offset=\"100%\" stop-color=\"#4d7cff\"/>\n          </linearGradient>\n        </defs>\n        <circle cx=\"100\" cy=\"100\" r=\"70\" stroke=\"url(#g2)\" stroke-width=\"1.4\" opacity=\"0.7\"/>\n        <circle cx=\"100\" cy=\"100\" r=\"46\" stroke=\"url(#g2)\" stroke-width=\"1.4\" opacity=\"0.5\"/>\n        <path d=\"M40 100 L80 100 L80 60 L120 60 L120 140 L160 140\" stroke=\"url(#g2)\" stroke-width=\"2\"/>\n        <path d=\"M40 70 L60 70 L60 130 L100 130\" stroke=\"url(#g2)\" stroke-width=\"2\" opacity=\"0.6\"/>\n        <circle cx=\"40\" cy=\"100\" r=\"4\" fill=\"url(#g2)\"/>\n        <circle cx=\"160\" cy=\"140\" r=\"4\" fill=\"url(#g2)\"/>\n        <circle cx=\"100\" cy=\"130\" r=\"4\" fill=\"url(#g2)\"/>\n        <circle cx=\"120\" cy=\"60\" r=\"4\" fill=\"url(#g2)\"/>\n      </svg>\n    </div>\n    <div class=\"about-text\">\n      <div class=\"section-label\">WHO I AM</div>\n      <h3>Sachin Tekriwal</h3>\n      <p>Sachin Tekriwal is an <strong>AI Engineer, AI Scientist and Teacher</strong> based in Mumbai, India, with 20+ years of experience in enterprise software and applied AI. He holds an MCA from MGU and an Advanced Diploma from IIIT Bangalore, and currently serves as <strong>CTO at NKB Workers</strong>.</p>\n      <p>He approaches every challenge as an architecture problem — understanding its structure, identifying inefficiencies, and engineering solutions that compound over time. His work sits at the intersection of intelligence and automation, guided by a simple philosophy: reduce friction, increase signal, automate deliberately.</p>\n      <p>Alongside his engineering work, he teaches — helping learners move from curiosity to genuine, applied AI capability.</p>\n      <div class=\"about-tags\">\n        <span class=\"highlight\">AI Scientist</span>\n        <span>AI Engineer</span>\n        <span>Teacher</span>\n        <span>20+ Years Experience</span>\n        <span>CTO, NKB Workers</span>\n        <span>MCA, MGU</span>\n        <span>Adv. Diploma, IIIT Bangalore</span>\n        <span>Mumbai, India</span>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"research\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <div class=\"section-label\">PRINCIPLES</div>\n      <div class=\"section-title\">Work Philosophy</div>\n      <p class=\"section-sub\">\"The best system is the one that disappears into the work.\"</p>\n    </div>\n    <div class=\"research-grid\">\n      <div class=\"r-card\">\n        <div class=\"r-icon\">🧩</div>\n        <h4>Simplicity over Complexity</h4>\n        <p>Every layer of unnecessary complexity is a point of failure. Elegant systems do more with less.</p>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">⚙️</div>\n        <h4>Automation over Repetition</h4>\n        <p>If a process can be defined, it can be automated. Human attention is reserved for real judgement.</p>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">🏗️</div>\n        <h4>Systems over Tasks</h4>\n        <p>Solving one problem is temporary. Building the system that prevents the problem class — that's the work worth doing.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-tagline grad-text\">LEARN · RESEARCH · INNOVATE · TRANSFORM</div>\n    <div class=\"foot-links\">\n      <a href=\"#\" data-page=\"index.html\">Home</a>\n      <a href=\"#\" data-page=\"about.html\">About</a>\n      <a href=\"#\" data-page=\"research.html\">Research</a>\n      <a href=\"#\" data-page=\"courses.html\">Courses</a>\n      <a href=\"#\" data-page=\"social.html\">Social Activities</a>\n      <a href=\"#\" data-page=\"contact.html\">Contact</a>\n      <a href=\"#\" data-page=\"sitemap.html\">Sitemap</a>\n    </div> ransition:color 0.2s;}\n  nav ul a:hover, nav ul a.active{color:var(--text);}\n  .nav-cta{\n    padding:9px 20px; border-radius:999px; font-size:13px; font-weight:600;\n    background:var(--grad); color:#0a0a16;\n  }\n\n  .page-hero{\n    padding:70px 0 50px; text-align:left;\n  }\n  .page-hero .section-label{margin-bottom:14px;}\n  .page-hero h1{\n    font-family:'Sora',sans-serif; font-weight:800;\n    font-size:clamp(32px,6vw,56px); line-height:1.05; letter-spacing:-0.01em;\n  }\n  .page-hero p{color:var(--text-dim); margin-top:18px; max-width:620px; font-size:15.5px; line-height:1.7;}\n\n  .hero{\n    padding:110px 0 90px;\n    text-align:left;\n    overflow:hidden;\n  }\n  .eyebrow{\n    display:inline-flex; align-items:center; gap:8px;\n    font-size:11px; letter-spacing:0.22em; font-weight:600; color:var(--text-dim);\n    border:1px solid var(--panel-line); padding:7px 16px; border-radius:999px;\n    margin-bottom:34px;\n  }\n  .eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--pink); box-shadow:0 0 10px var(--pink);}\n  .hero h1{\n    font-family:'Sora',sans-serif; font-weight:800;\n    font-size:clamp(40px, 8vw, 92px);\n    line-height:1.02;\n    letter-spacing:-0.01em;\n  }\n  .hero .tagline{\n    margin-top:22px;\n    font-size:clamp(14px,2vw,17px);\n    color:var(--text-dim);\n    font-weight:500;\n    letter-spacing:0.02em;\n  }\n  .hero .desc{\n    max-width:560px; margin:26px 0 0;\n    color:var(--text-dim); font-size:16px; line-height:1.7;\n  }\n  .hero-ctas{\n    margin-top:42px; display:flex; gap:16px; justify-content:flex-start; flex-wrap:wrap;\n  }\n  .btn-primary{\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:14px;\n    padding:15px 30px; border-radius:999px; border:none; cursor:pointer;\n  }\n  .btn-ghost{\n    border:1px solid var(--panel-line); color:var(--text); font-weight:600; font-size:14px;\n    padding:15px 30px; border-radius:999px; background:transparent; cursor:pointer;\n  }\n  .btn-ghost:hover{border-color:rgba(255,255,255,0.3);}\n\n  .stat-strip{\n    margin-top:80px; display:flex; justify-content:center; gap:0; flex-wrap:wrap;\n    border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);\n    padding:34px 0;\n  }\n  .stat{padding:0 44px; text-align:center; border-right:1px solid var(--panel-line);}\n  .stat:last-child{border-right:none;}\n  .stat b{display:block; font-family:'Sora',sans-serif; font-size:30px; font-weight:700;}\n  .stat span{font-size:12px; color:var(--text-dim); letter-spacing:0.05em;}\n\n  .section-head{margin-bottom:52px; text-align:center;}\n  .section-label{\n    font-size:12px; font-weight:700; letter-spacing:0.2em; color:var(--pink);\n    text-transform:uppercase; margin-bottom:14px;\n  }\n  .section-title{\n    font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(28px,4vw,42px);\n  }\n  .section-sub{color:var(--text-dim); margin-top:14px; max-width:560px; margin-left:auto; margin-right:auto; font-size:15px; line-height:1.7;}\n\n  .about{padding:90px 0;}\n  .about-grid{\n    display:grid; grid-template-columns:0.85fr 1.15fr; gap:64px; align-items:center;\n  }\n  .about-visual{\n    position:relative; aspect-ratio:1/1; border-radius:24px;\n    border:1px solid var(--panel-line);\n    background:linear-gradient(160deg, rgba(166,59,255,0.12), rgba(77,124,255,0.06));\n    display:flex; align-items:center; justify-content:center;\n  }\n  .about-visual .core{\n    width:64%; aspect-ratio:1/1; border-radius:50%;\n    background:var(--grad);\n    filter:blur(40px); opacity:0.5; position:absolute;\n  }\n  .about-visual svg{position:relative; width:70%; height:70%;}\n  .about-text h3{font-family:'Sora',sans-serif; font-size:26px; margin-bottom:18px; font-weight:700;}\n  .about-text p{color:var(--text-dim); line-height:1.85; font-size:15.5px; margin-bottom:16px;}\n  .about-tags{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px;}\n  .about-tags span{\n    font-size:12px; padding:8px 16px; border-radius:999px; border:1px solid var(--panel-line); color:var(--text-dim);\n  }\n  .about-tags span.highlight{\n    border-color:transparent;\n    background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box, var(--grad) border-box;\n    border:1.5px solid transparent; color:var(--text); font-weight:600;\n  }\n\n  .research{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);}\n  .research-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}\n  .r-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:32px 26px;\n    transition:transform 0.25s, border-color 0.25s;\n  }\n  .r-card:hover{transform:translateY(-6px); border-color:rgba(255,255,255,0.2);}\n  .r-icon{\n    width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;\n    background:var(--grad); margin-bottom:22px; font-size:20px;\n  }\n  .r-card h4{font-family:'Sora',sans-serif; font-size:18px; margin-bottom:12px; font-weight:600;}\n  .r-card p{color:var(--text-dim); font-size:14px; line-height:1.7;}\n  .r-card .r-tag{display:inline-block; margin-top:18px; font-size:11px; letter-spacing:0.08em; color:var(--pink); font-weight:700; text-transform:uppercase;}\n\n  .courses{padding:90px 0;}\n  .course-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}\n  .c-card{\n    border:1px solid var(--panel-line); border-radius:18px; overflow:hidden;\n    background:var(--panel); display:flex; flex-direction:column;\n  }\n  .c-top{\n    padding:26px 26px 20px; border-bottom:1px solid var(--panel-line);\n    display:flex; align-items:flex-start; justify-content:space-between;\n  }\n  .c-level{font-size:11px; font-weight:700; letter-spacing:0.08em; padding:5px 12px; border-radius:999px; border:1px solid var(--panel-line); color:var(--text-dim);}\n  .c-body{padding:24px 26px; flex:1;}\n  .c-body h4{font-family:'Sora',sans-serif; font-size:19px; font-weight:600; margin-bottom:10px;}\n  .c-body p{color:var(--text-dim); font-size:14px; line-height:1.7; margin-bottom:18px;}\n  .c-meta{display:flex; gap:16px; font-size:12.5px; color:var(--text-dim); margin-bottom:0;}\n  .c-meta b{color:var(--text); font-weight:600;}\n  .c-students{\n    display:flex; align-items:center; gap:8px; margin-top:16px; font-size:12.5px; color:var(--text-dim);\n  }\n  .avatars{display:flex;}\n  .avatars span{\n    width:22px; height:22px; border-radius:50%; border:2px solid var(--panel);\n    background:var(--grad); margin-left:-8px; display:inline-block;\n  }\n  .avatars span:first-child{margin-left:0;}\n  .c-bottom{padding:20px 26px; border-top:1px solid var(--panel-line);}\n  .c-enroll{\n    display:block; text-align:center; width:100%; padding:12px; border-radius:10px;\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:13.5px; border:none; cursor:pointer;\n  }\n\n  .social{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);}\n  .social-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:22px; padding:44px;\n    display:grid; grid-template-columns:1.2fr 0.8fr; gap:40px; align-items:center;\n  }\n  .social-card h3{font-family:'Sora',sans-serif; font-size:26px; font-weight:700; margin-bottom:14px;}\n  .social-card p{color:var(--text-dim); font-size:15px; line-height:1.8; margin-bottom:22px;}\n  .social-links{display:flex; gap:14px; flex-wrap:wrap;}\n  .social-stats{display:grid; grid-template-columns:1fr 1fr; gap:20px;}\n  .social-stats .stat-box{\n    text-align:center; padding:22px 10px; border:1px solid var(--panel-line); border-radius:14px;\n  }\n  .social-stats .stat-box b{display:block; font-family:'Sora',sans-serif; font-size:26px; font-weight:700;}\n  .social-stats .stat-box span{font-size:11px; color:var(--text-dim); letter-spacing:0.05em;}\n  .activity-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:36px;}\n  .activity-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:26px;\n  }\n  .activity-card .r-icon{width:40px; height:40px; font-size:17px; margin-bottom:16px;}\n  .activity-card h4{font-family:'Sora',sans-serif; font-size:16px; margin-bottom:10px; font-weight:600;}\n  .activity-card p{color:var(--text-dim); font-size:13.5px; line-height:1.7;}\n\n  .contact{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line);}\n  .contact-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:60px;}\n  .contact-info h3{font-family:'Sora',sans-serif; font-size:28px; margin-bottom:18px; font-weight:700;}\n  .contact-info p{color:var(--text-dim); line-height:1.8; font-size:15px; margin-bottom:30px;}\n  .info-row{display:flex; align-items:center; gap:14px; margin-bottom:18px; font-size:14px;}\n  .info-icon{\n    width:38px; height:38px; border-radius:10px; border:1px solid var(--panel-line);\n    display:flex; align-items:center; justify-content:center; flex-shrink:0;\n  }\n  form{background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:34px;}\n  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}\n  label{font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:8px; font-weight:500;}\n  input, textarea{\n    width:100%; background:var(--bg); border:1px solid var(--panel-line); border-radius:10px;\n    padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px;\n  }\n  input:focus, textarea:focus{outline:2px solid var(--purple); outline-offset:1px; border-color:transparent;}\n  textarea{resize:vertical; min-height:110px; margin-bottom:22px;}\n  .form-full{margin-bottom:16px;}\n  .submit-btn{\n    width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer;\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:14.5px;\n  }\n\n  /* ---------- COMMENTS ---------- */\n  .comments{padding:90px 0;}\n  .comments .section-head{text-align:left; margin-bottom:36px;}\n  .comment-form{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:28px; margin-bottom:36px;\n  }\n  .comment-form .form-row{grid-template-columns:1fr 1fr;}\n  .comment-list{display:flex; flex-direction:column; gap:18px;}\n  .comment-item{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:22px 24px;\n  }\n  .comment-item .c-head{display:flex; align-items:center; gap:12px; margin-bottom:10px;}\n  .comment-item .c-avatar{\n    width:34px; height:34px; border-radius:50%; background:var(--grad); flex-shrink:0;\n    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#0a0a16;\n    font-family:'Sora',sans-serif;\n  }\n  .comment-item .c-name{font-weight:600; font-size:14px;}\n  .comment-item .c-time{font-size:11.5px; color:var(--text-dim); margin-left:auto;}\n  .comment-item .c-text{color:var(--text-dim); font-size:14px; line-height:1.7;}\n  .comment-empty{color:var(--text-dim); font-size:14px; padding:18px 0;}\n\n  /* ---------- SITEMAP ---------- */\n  .sitemap-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:36px; padding:20px 0 90px;}\n  .sitemap-col h4{font-family:'Sora',sans-serif; font-size:15px; margin-bottom:16px; color:var(--pink); letter-spacing:0.05em; text-transform:uppercase;}\n  .sitemap-col ul{display:flex; flex-direction:column; gap:12px;}\n  .sitemap-col a{color:var(--text-dim); font-size:14.5px;}\n  .sitemap-col a:hover{color:var(--text);}\n\n  footer{padding:44px 0; text-align:center; border-top:1px solid var(--panel-line);}\n  footer p{color:var(--text-dim); font-size:13px;}\n  footer .foot-tagline{\n    font-size:11px; letter-spacing:0.18em; color:var(--text-dim); margin-bottom:14px; font-weight:600;\n  }\n  footer .foot-links{display:flex; justify-content:center; gap:22px; margin-bottom:18px; font-size:12.5px; flex-wrap:wrap;}\n  footer .foot-links a{color:var(--text-dim);}\n  footer .foot-links a:hover{color:var(--text);}\n\n  @media(max-width:860px){\n    nav ul{display:none;}\n    .nav-cta{display:none;}\n    .about-grid, .contact-grid, .social-card{grid-template-columns:1fr; gap:40px;}\n    .research-grid, .course-grid, .activity-grid, .sitemap-grid, .social-stats{grid-template-columns:1fr;}\n    .stat{padding:0 22px;}\n    .form-row{grid-template-columns:1fr;}\n  }\n\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <nav>\n      <a class=\"brand\" href=\"#\" data-page=\"index.html\">\n        <div class=\"brand-badge\"><span>ST</span></div>\n        <div class=\"brand-name\">Sachin Tekriwal<small>AI RESEARCH &amp; EDUCATION</small></div>\n      </a>\n      <ul>\n          <li><a href=\"#\" data-page=\"index.html\">Home</a></li>\n          <li><a href=\"#\" data-page=\"about.html\">About</a></li>\n          <li><a href=\"#\" data-page=\"courses.html\">Courses</a></li>\n          <li><a href=\"#\" data-page=\"research.html\" class=\"active\">Research</a></li>\n          <li><a href=\"#\" data-page=\"social.html\">Social</a></li>\n          <li><a href=\"#\" data-page=\"contact.html\">Contact</a></li>\n      </ul>\n      <a class=\"nav-cta\" href=\"#\" data-page=\"contact.html\">Contact</a>\n    </nav>\n  </div>\n</header>\n\n<section class=\"page-hero\">\n  <div class=\"wrap\">\n    <div class=\"section-label\">RESEARCH</div>\n    <h1>Projects &amp; <span class=\"grad-text\">Focus Areas.</span></h1>\n    <p>Applied research at the intersection of learning systems and real deployment challenges.</p>\n  </div>\n</section>\n\n<section class=\"research\" style=\"border-top:none;\">\n  <div class=\"wrap\">\n    <div class=\"research-grid\">\n      <div class=\"r-card\">\n        <div class=\"r-icon\">🧠</div>\n        <h4>Applied Neural Systems</h4>\n        <p>Designing and evaluating neural architectures for practical, resource-constrained deployment scenarios.</p>\n        <span class=\"r-tag\">Ongoing</span>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">🔎</div>\n        <h4>Natural Language Understanding</h4>\n        <p>Research on retrieval, reasoning, and language grounding for domain-specific assistants.</p>\n        <span class=\"r-tag\">Ongoing</span>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">👁️</div>\n        <h4>Computer Vision Pipelines</h4>\n        <p>Efficient vision pipelines for classification and detection tasks across low-data environments.</p>\n        <span class=\"r-tag\">Published</span>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">📊</div>\n        <h4>AI in Education</h4>\n        <p>Studying how adaptive, AI-assisted teaching methods improve learning outcomes for technical subjects.</p>\n        <span class=\"r-tag\">Ongoing</span>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">⚙️</div>\n        <h4>MLOps &amp; Deployment</h4>\n        <p>Best practices for taking research models into reliable, monitored production systems.</p>\n        <span class=\"r-tag\">Published</span>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">🤝</div>\n        <h4>Human-AI Collaboration</h4>\n        <p>Exploring interface and workflow design for effective collaboration between people and AI systems.</p>\n        <span class=\"r-tag\">Ongoing</span>\n      </div>\n      <div class=\"r-card\">\n        <div class=\"r-icon\">🤖</div>\n        <h4>AI Agents &amp; Automation</h4>\n        <p>Building autonomous systems that reason, act, delegate, and iterate with minimal supervision.</p>\n        <span class=\"r-tag\">Ongoing</span>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"comments\">\n  <div class=\"wrap\">\n    <div class=\"section-head\" style=\"text-align:center;\">\n      <div class=\"section-label\">DISCUSSION</div>\n      <div class=\"section-title\">Comments</div>\n      <p class=\"section-sub\">Share your thoughts, questions, or feedback on this research.</p>\n    </div>\n\n    <form class=\"comment-form\" id=\"commentForm\">\n      <div class=\"form-row\">\n        <div>\n          <label for=\"cName\">Name</label>\n          <input type=\"text\" id=\"cName\" placeholder=\"Your name\" required>\n        </div>\n        <div>\n          <label for=\"cEmail\">Email (not published)</label>\n          <input type=\"email\" id=\"cEmail\" placeholder=\"you@email.com\">\n        </div>\n      </div>\n      <label for=\"cText\">Comment</label>\n      <textarea id=\"cText\" placeholder=\"Write your comment...\" required></textarea>\n      <button type=\"submit\" class=\"submit-btn\">Post Comment</button>\n    </form>\n\n    <div class=\"comment-list\" id=\"commentList\"></div>\n  </div>\n</section>\n\n<script>\n  const STORAGE_KEY = 'st_research_comments';\n\n  function loadComments(){\n    try{\n      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];\n    }catch(e){ return []; }\n  }\n  function saveComments(list){\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));\n  }\n  function initials(name){\n    return name.trim().split(/\\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();\n  }\n  function renderComments(){\n    const list = loadComments();\n    const el = document.getElementById('commentList');\n    if(list.length === 0){\n      el.innerHTML = '<div class=\"comment-empty\">No comments yet — be the first to share your thoughts.</div>';\n      return;\n    }\n    el.innerHTML = list.slice().reverse().map(c => `\n      <div class=\"comment-item\">\n        <div class=\"c-head\">\n          <div class=\"c-avatar\">${initials(c.name)}</div>\n          <div class=\"c-name\">${c.name}</div>\n          <div class=\"c-time\">${c.time}</div>\n        </div>\n        <div class=\"c-text\">${c.text}</div>\n      </div>\n    `).join('');\n  }\n\n  document.getElementById('commentForm').addEventListener('submit', function(e){\n    e.preventDefault();\n    const name = document.getElementById('cName').value.trim();\n    const text = document.getElementById('cText').value.trim();\n    if(!name || !text) return;\n    const list = loadComments();\n    list.push({\n      name: name,\n      text: text,\n      time: new Date().toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'})\n    });\n    saveComments(list);\n    document.getElementById('cText').value = '';\n    document.getElementById('cName').value = '';\n    document.getElementById('cEmail').value = '';\n    renderComments();\n  });\n\n  renderComments();\n<\/script>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-tagline grad-text\">LEARN · RESEARCH · INNOVATE · TRANSFORM</div>\n    <div class=\"foot-links\">\n      <a href=\"#\" data-page=\"index.html\">Home</a>\n      <a href=\"#\" data-page=\"about.html\">About</a>\n      <a href=\"#\" data-page=\"research.html\">Research</a>\n      <a href=\"#\" data-page=\"courses.html\">Courses</a>\n      <a href=\"#\" data-page=\"social.html\">Social Activities</a>\n      <a href=\"#\" data-page=\"contact.html\">Contact</a>\n      <a href=\"#\" data-page=\"sitemap.html\">Sitemap</a>\n    </div>\n    <p>© 2026 Sachin Tekriwal — AI Research &amp; Education Center. All rights reserved.</p>\n  </div>\n</footer>\n\n\n<!-- Live Chat Widget (Tawk.to) -->\n<script type=\"text/javascript\">\nvar Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();\n(function(){\nvar s1=document.createElement(\"script\"),s2=document.getElementsByTagName(\"script\")[0];\ns1.async=true;\ns1.src='https://embed.tawk.to/YOUR_PROPERTY_ID/default';\ns1.charset='UTF-8';\ns1.setAttribute('crossorigin','*');\ns2.parentNode.insertBefore(s1,s2);\n})();\n<\/script>\n\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest(\"a[data-page]\");if(a){e.preventDefault();parent.postMessage({type:\"go\",page:a.dataset.page},\"*\");}});<\/script></body>\n</html>", "social.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Social Activities — Sachin Tekriwal</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n\n  :root{\n    --bg:#0a0a16;\n    --bg-2:#0e0d21;\n    --panel:#12122a;\n    --panel-line:rgba(255,255,255,0.08);\n    --gold:#ffc93c;\n    --pink:#ff4fa3;\n    --purple:#a63bff;\n    --blue:#4d7cff;\n    --text:#f2f1fb;\n    --text-dim:#a7a5c4;\n    --grad: linear-gradient(92deg,var(--gold) 0%,var(--pink) 35%,var(--purple) 65%,var(--blue) 100%);\n  }\n  *{box-sizing:border-box; margin:0; padding:0;}\n  html{scroll-behavior:smooth;}\n  body{\n    background:\n      radial-gradient(circle at 15% 0%, rgba(166,59,255,0.16), transparent 40%),\n      radial-gradient(circle at 85% 10%, rgba(77,124,255,0.14), transparent 40%),\n      radial-gradient(circle at 50% 100%, rgba(255,79,163,0.10), transparent 45%),\n      var(--bg);\n    color:var(--text);\n    font-family:'Inter',sans-serif;\n    overflow-x:hidden;\n  }\n  a{text-decoration:none; color:inherit;}\n  ul{list-style:none;}\n  img{max-width:100%; display:block;}\n  .grad-text{\n    background:var(--grad);\n    -webkit-background-clip:text;\n    background-clip:text;\n    -webkit-text-fill-color:transparent;\n  }\n  .wrap{max-width:1160px; margin:0 auto; padding:0 28px;}\n  section{position:relative;}\n\n  header{\n    position:sticky; top:0; z-index:50;\n    backdrop-filter:blur(14px);\n    background:rgba(10,10,22,0.65);\n    border-bottom:1px solid var(--panel-line);\n  }\n  nav{\n    display:flex; align-items:center; justify-content:space-between;\n    padding:16px 0;\n  }\n  .brand{display:flex; align-items:center; gap:12px; font-family:'Sora',sans-serif; font-weight:700; letter-spacing:0.02em;}\n  .brand-badge{\n    width:38px; height:38px; border-radius:10px;\n    border:1.5px solid transparent;\n    background:\n      linear-gradient(var(--bg-2),var(--bg-2)) padding-box,\n      var(--grad) border-box;\n    display:flex; align-items:center; justify-content:center;\n    font-family:'Sora',sans-serif; font-weight:800; font-size:15px;\n  }\n  .brand-badge span{\n    background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;\n  }\n  .brand-name{font-size:16px;}\n  .brand-name small{display:block; font-weight:500; font-size:10px; letter-spacing:0.16em; color:var(--text-dim); font-family:'Inter',sans-serif;}\n  nav ul{display:flex; gap:30px; font-size:14px; font-weight:500;}\n  nav ul a{color:var(--text-dim); transition:color 0.2s;}\n  nav ul a:hover, nav ul a.active{color:var(--text);}\n  .nav-cta{\n    padding:9px 20px; border-radius:999px; font-size:13px; font-weight:600;\n    background:var(--grad); color:#0a0a16;\n  }\n\n  .page-hero{\n    padding:70px 0 50px; text-align:left;\n  }\n  .page-hero .section-label{margin-bottom:14px;}\n  .page-hero h1{\n    font-family:'Sora',sans-serif; font-weight:800;\n    font-size:clamp(32px,6vw,56px); line-height:1.05; letter-spacing:-0.01em;\n  }\n  .page-hero p{color:var(--text-dim); margin-top:18px; max-width:620px; font-size:15.5px; line-height:1.7;}\n\n  .hero{\n    padding:110px 0 90px;\n    text-align:left;\n    overflow:hidden;\n  }\n  .eyebrow{\n    display:inline-flex; align-items:center; gap:8px;\n    font-size:11px; letter-spacing:0.22em; font-weight:600; color:var(--text-dim);\n    border:1px solid var(--panel-line); padding:7px 16px; border-radius:999px;\n    margin-bottom:34px;\n  }\n  .eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--pink); box-shadow:0 0 10px var(--pink);}\n  .hero h1{\n    font-family:'Sora',sans-serif; font-weight:800;\n    font-size:clamp(40px, 8vw, 92px);\n    line-height:1.02;\n    letter-spacing:-0.01em;\n  }\n  .hero .tagline{\n    margin-top:22px;\n    font-size:clamp(14px,2vw,17px);\n    color:var(--text-dim);\n    font-weight:500;\n    letter-spacing:0.02em;\n  }\n  .hero .desc{\n    max-width:560px; margin:26px 0 0;\n    color:var(--text-dim); font-size:16px; line-height:1.7;\n  }\n  .hero-ctas{\n    margin-top:42px; display:flex; gap:16px; justify-content:flex-start; flex-wrap:wrap;\n  }\n  .btn-primary{\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:14px;\n    padding:15px 30px; border-radius:999px; border:none; cursor:pointer;\n  }\n  .btn-ghost{\n    border:1px solid var(--panel-line); color:var(--text); font-weight:600; font-size:14px;\n    padding:15px 30px; border-radius:999px; background:transparent; cursor:pointer;\n  }\n  .btn-ghost:hover{border-color:rgba(255,255,255,0.3);}\n\n  .stat-strip{\n    margin-top:80px; display:flex; justify-content:center; gap:0; flex-wrap:wrap;\n    border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);\n    padding:34px 0;\n  }\n  .stat{padding:0 44px; text-align:center; border-right:1px solid var(--panel-line);}\n  .stat:last-child{border-right:none;}\n  .stat b{display:block; font-family:'Sora',sans-serif; font-size:30px; font-weight:700;}\n  .stat span{font-size:12px; color:var(--text-dim); letter-spacing:0.05em;}\n\n  .section-head{margin-bottom:52px; text-align:center;}\n  .section-label{\n    font-size:12px; font-weight:700; letter-spacing:0.2em; color:var(--pink);\n    text-transform:uppercase; margin-bottom:14px;\n  }\n  .section-title{\n    font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(28px,4vw,42px);\n  }\n  .section-sub{color:var(--text-dim); margin-top:14px; max-width:560px; margin-left:auto; margin-right:auto; font-size:15px; line-height:1.7;}\n\n  .about{padding:90px 0;}\n  .about-grid{\n    display:grid; grid-template-columns:0.85fr 1.15fr; gap:64px; align-items:center;\n  }\n  .about-visual{\n    position:relative; aspect-ratio:1/1; border-radius:24px;\n    border:1px solid var(--panel-line);\n    background:linear-gradient(160deg, rgba(166,59,255,0.12), rgba(77,124,255,0.06));\n    display:flex; align-items:center; justify-content:center;\n  }\n  .about-visual .core{\n    width:64%; aspect-ratio:1/1; border-radius:50%;\n    background:var(--grad);\n    filter:blur(40px); opacity:0.5; position:absolute;\n  }\n  .about-visual svg{position:relative; width:70%; height:70%;}\n  .about-text h3{font-family:'Sora',sans-serif; font-size:26px; margin-bottom:18px; font-weight:700;}\n  .about-text p{color:var(--text-dim); line-height:1.85; font-size:15.5px; margin-bottom:16px;}\n  .about-tags{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px;}\n  .about-tags span{\n    font-size:12px; padding:8px 16px; border-radius:999px; border:1px solid var(--panel-line); color:var(--text-dim);\n  }\n  .about-tags span.highlight{\n    border-color:transparent;\n    background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box, var(--grad) border-box;\n    border:1.5px solid transparent; color:var(--text); font-weight:600;\n  }\n\n  .research{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);}\n  .research-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}\n  .r-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:32px 26px;\n    transition:transform 0.25s, border-color 0.25s;\n  }\n  .r-card:hover{transform:translateY(-6px); border-color:rgba(255,255,255,0.2);}\n  .r-icon{\n    width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;\n    background:var(--grad); margin-bottom:22px; font-size:20px;\n  }\n  .r-card h4{font-family:'Sora',sans-serif; font-size:18px; margin-bottom:12px; font-weight:600;}\n  .r-card p{color:var(--text-dim); font-size:14px; line-height:1.7;}\n  .r-card .r-tag{display:inline-block; margin-top:18px; font-size:11px; letter-spacing:0.08em; color:var(--pink); font-weight:700; text-transform:uppercase;}\n\n  .courses{padding:90px 0;}\n  .course-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}\n  .c-card{\n    border:1px solid var(--panel-line); border-radius:18px; overflow:hidden;\n    background:var(--panel); display:flex; flex-direction:column;\n  }\n  .c-top{\n    padding:26px 26px 20px; border-bottom:1px solid var(--panel-line);\n    display:flex; align-items:flex-start; justify-content:space-between;\n  }\n  .c-level{font-size:11px; font-weight:700; letter-spacing:0.08em; padding:5px 12px; border-radius:999px; border:1px solid var(--panel-line); color:var(--text-dim);}\n  .c-body{padding:24px 26px; flex:1;}\n  .c-body h4{font-family:'Sora',sans-serif; font-size:19px; font-weight:600; margin-bottom:10px;}\n  .c-body p{color:var(--text-dim); font-size:14px; line-height:1.7; margin-bottom:18px;}\n  .c-meta{display:flex; gap:16px; font-size:12.5px; color:var(--text-dim); margin-bottom:0;}\n  .c-meta b{color:var(--text); font-weight:600;}\n  .c-students{\n    display:flex; align-items:center; gap:8px; margin-top:16px; font-size:12.5px; color:var(--text-dim);\n  }\n  .avatars{display:flex;}\n  .avatars span{\n    width:22px; height:22px; border-radius:50%; border:2px solid var(--panel);\n    background:var(--grad); margin-left:-8px; display:inline-block;\n  }\n  .avatars span:first-child{margin-left:0;}\n  .c-bottom{padding:20px 26px; border-top:1px solid var(--panel-line);}\n  .c-enroll{\n    display:block; text-align:center; width:100%; padding:12px; border-radius:10px;\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:13.5px; border:none; cursor:pointer;\n  }\n\n  .social{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);}\n  .social-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:22px; padding:44px;\n    display:grid; grid-template-columns:1.2fr 0.8fr; gap:40px; align-items:center;\n  }\n  .social-card h3{font-family:'Sora',sans-serif; font-size:26px; font-weight:700; margin-bottom:14px;}\n  .social-card p{color:var(--text-dim); font-size:15px; line-height:1.8; margin-bottom:22px;}\n  .social-links{display:flex; gap:14px; flex-wrap:wrap;}\n  .social-stats{display:grid; grid-template-columns:1fr 1fr; gap:20px;}\n  .social-stats .stat-box{\n    text-align:center; padding:22px 10px; border:1px solid var(--panel-line); border-radius:14px;\n  }\n  .social-stats .stat-box b{display:block; font-family:'Sora',sans-serif; font-size:26px; font-weight:700;}\n  .social-stats .stat-box span{font-size:11px; color:var(--text-dim); letter-spacing:0.05em;}\n  .activity-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:36px;}\n  .activity-card{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:26px;\n  }\n  .activity-card .r-icon{width:40px; height:40px; font-size:17px; margin-bottom:16px;}\n  .activity-card h4{font-family:'Sora',sans-serif; font-size:16px; margin-bottom:10px; font-weight:600;}\n  .activity-card p{color:var(--text-dim); font-size:13.5px; line-height:1.7;}\n\n  .contact{padding:90px 0; background:var(--bg-2); border-top:1px solid var(--panel-line);}\n  .contact-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:60px;}\n  .contact-info h3{font-family:'Sora',sans-serif; font-size:28px; margin-bottom:18px; font-weight:700;}\n  .contact-info p{color:var(--text-dim); line-height:1.8; font-size:15px; margin-bottom:30px;}\n  .info-row{display:flex; align-items:center; gap:14px; margin-bottom:18px; font-size:14px;}\n  .info-icon{\n    width:38px; height:38px; border-radius:10px; border:1px solid var(--panel-line);\n    display:flex; align-items:center; justify-content:center; flex-shrink:0;\n  }\n  form{background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:34px;}\n  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}\n  label{font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:8px; font-weight:500;}\n  input, textarea{\n    width:100%; background:var(--bg); border:1px solid var(--panel-line); border-radius:10px;\n    padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px;\n  }\n  input:focus, textarea:focus{outline:2px solid var(--purple); outline-offset:1px; border-color:transparent;}\n  textarea{resize:vertical; min-height:110px; margin-bottom:22px;}\n  .form-full{margin-bottom:16px;}\n  .submit-btn{\n    width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer;\n    background:var(--grad); color:#0a0a16; font-weight:700; font-size:14.5px;\n  }\n\n  /* ---------- COMMENTS ---------- */\n  .comments{padding:90px 0;}\n  .comments .section-head{text-align:left; margin-bottom:36px;}\n  .comment-form{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:28px; margin-bottom:36px;\n  }\n  .comment-form .form-row{grid-template-columns:1fr 1fr;}\n  .comment-list{display:flex; flex-direction:column; gap:18px;}\n  .comment-item{\n    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:22px 24px;\n  }\n  .comment-item .c-head{display:flex; align-items:center; gap:12px; margin-bottom:10px;}\n  .comment-item .c-avatar{\n    width:34px; height:34px; border-radius:50%; background:var(--grad); flex-shrink:0;\n    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#0a0a16;\n    font-family:'Sora',sans-serif;\n  }\n  .comment-item .c-name{font-weight:600; font-size:14px;}\n  .comment-item .c-time{font-size:11.5px; color:var(--text-dim); margin-left:auto;}\n  .comment-item .c-text{color:var(--text-dim); font-size:14px; line-heig
